# Netlify reads this from the site's base directory.
# In the Netlify UI set:  Base directory = v2
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 needs a modern Node; pin it so the build doesn't drift with Netlify's default
  NODE_VERSION = "22"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
